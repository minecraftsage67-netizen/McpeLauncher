name: Build Launcher APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: ks
          key: mcpe-keystore-v1
      - name: Download base APK from release "base"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base --repo ${{ github.repository }} --pattern '*.apk' --output base.apk || { echo "ERROR: attach your 0.15.10 APK to a release with tag 'base'"; exit 1; }
          ls -la base.apk
      - name: Write sources
        run: |
          mkdir -p $(dirname src/dev/mcpelauncher/Hook.java)
          cat > src/dev/mcpelauncher/Hook.java <<'EOF_H'
          package dev.mcpelauncher;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Instrumentation;
          import android.content.DialogInterface;
          import android.content.SharedPreferences;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.text.InputType;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.PopupWindow;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          /** In-game launcher: floating menu button + optional on-screen keymap that injects key events into the game. */
          public final class Hook {
              private Hook() {}

              interface Cb { void ok(String s); }

              static Activity act;
              static SharedPreferences sp;
              static final Handler H = new Handler(Looper.getMainLooper());
              static final ExecutorService EX = Executors.newSingleThreadExecutor();
              static final List<PopupWindow> wins = new ArrayList<PopupWindow>();
              static JSONObject profiles = new JSONObject();
              static String cur = "Default";
              static boolean keymapOn = false, edit = false, toasted = false;
              static Instrumentation inst;

              /** Called from MainActivity.onCreate (smali patch). Must never throw. */
              public static void onCreate(Activity a) {
                  try {
                      dismissAll();
                      act = a;
                      sp = a.getSharedPreferences("mcpelauncher", 0);
                      loadState();
                      H.removeCallbacks(TICK);
                      H.postDelayed(TICK, 2500);
                  } catch (Throwable t) { }
              }

              static final Runnable TICK = new Runnable() {
                  public void run() {
                      try {
                          Activity a = act;
                          if (a == null || a.isFinishing()) return;
                          View d = a.getWindow().getDecorView();
                          if (d.getWindowToken() != null && d.getWidth() > 0) {
                              boolean ok = !wins.isEmpty();
                              for (PopupWindow p : wins) if (!p.isShowing()) ok = false;
                              if (!ok) buildAll();
                          }
                      } catch (Throwable t) { }
                      H.postDelayed(this, 2000);
                  }
              };

              static void dismissAll() {
                  for (PopupWindow p : wins) { try { p.dismiss(); } catch (Throwable t) { } }
                  wins.clear();
              }

              static void loadState() {
                  try { profiles = new JSONObject(sp.getString("profiles", "{}")); } catch (Throwable t) { profiles = new JSONObject(); }
                  try { if (!profiles.has("Default")) profiles.put("Default", defaults()); } catch (Throwable t) { }
                  cur = sp.getString("cur", "Default");
                  if (!profiles.has(cur)) cur = "Default";
                  keymapOn = sp.getBoolean("on", false);
              }

              static JSONArray defaults() throws Exception {
                  String[][] d = {{"W", "0.12", "0.40"}, {"A", "0.04", "0.58"}, {"S", "0.12", "0.76"}, {"D", "0.20", "0.58"},
                          {"Jump", "0.88", "0.52"}, {"Shift", "0.80", "0.72"}, {"E", "0.92", "0.28"}};
                  JSONArray a = new JSONArray();
                  for (String[] r : d) {
                      JSONObject o = new JSONObject();
                      o.put("l", r[0]); o.put("x", Double.parseDouble(r[1])); o.put("y", Double.parseDouble(r[2]));
                      a.put(o);
                  }
                  return a;
              }

              static void save() {
                  try { sp.edit().putString("profiles", profiles.toString()).putString("cur", cur).putBoolean("on", keymapOn).apply(); } catch (Throwable t) { }
              }

              static JSONArray arr() {
                  try { return profiles.getJSONArray(cur); } catch (Throwable t) { return new JSONArray(); }
              }

              static TextView circle(String text, int color) {
                  TextView t = new TextView(act);
                  t.setText(text);
                  t.setTextColor(0xFFFFFFFF);
                  t.setGravity(Gravity.CENTER);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(color);
                  g.setStroke(3, 0xFFFFFFFF);
                  t.setBackgroundDrawable(g);
                  t.setAlpha(0.75f);
                  return t;
              }

              static PopupWindow pop(View v, int w, int h, int x, int y) {
                  PopupWindow p = new PopupWindow(v, w, h, false);
                  p.setClippingEnabled(false);
                  p.setTouchable(true);
                  p.setOutsideTouchable(false);
                  p.setInputMethodMode(PopupWindow.INPUT_METHOD_NOT_NEEDED);
                  p.showAtLocation(act.getWindow().getDecorView(), Gravity.TOP | Gravity.START, x, y);
                  return p;
              }

              static void buildAll() {
                  dismissAll();
                  DisplayMetrics dm = act.getResources().getDisplayMetrics();
                  int ms = (int) (40 * dm.density);
                  TextView m = circle("\u2630", 0xCC3B82F6);
                  m.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { openMenu(); } });
                  wins.add(pop(m, ms, ms, (int) (8 * dm.density), (int) (8 * dm.density)));
                  if (!keymapOn) return;
                  JSONArray a = arr();
                  int sz = (int) (52 * dm.density);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null) addKey(o, dm, sz);
                  }
              }

              static void addKey(final JSONObject o, final DisplayMetrics dm, int sz) {
                  final String label = o.optString("l", "?");
                  final int code = keyCode(label);
                  final int[] pos = {(int) (o.optDouble("x", 0.1) * dm.widthPixels), (int) (o.optDouble("y", 0.5) * dm.heightPixels)};
                  final int[] st = new int[4];
                  final PopupWindow[] ref = new PopupWindow[1];
                  TextView t = circle(label, code < 0 ? 0x88EF4444 : 0x8822C55E);
                  t.setTextSize(label.length() > 2 ? 11 : 16);
                  t.setOnTouchListener(new View.OnTouchListener() {
                      public boolean onTouch(View v, MotionEvent e) {
                          int a = e.getActionMasked();
                          if (edit) {
                              if (a == MotionEvent.ACTION_DOWN) {
                                  st[0] = (int) e.getRawX(); st[1] = (int) e.getRawY(); st[2] = pos[0]; st[3] = pos[1];
                              } else if (a == MotionEvent.ACTION_MOVE) {
                                  pos[0] = st[2] + (int) e.getRawX() - st[0];
                                  pos[1] = st[3] + (int) e.getRawY() - st[1];
                                  ref[0].update(pos[0], pos[1], -1, -1);
                              } else if (a == MotionEvent.ACTION_UP) {
                                  try {
                                      o.put("x", Math.max(0, Math.min(1, pos[0] / (double) dm.widthPixels)));
                                      o.put("y", Math.max(0, Math.min(1, pos[1] / (double) dm.heightPixels)));
                                  } catch (Throwable ex) { }
                                  save();
                              }
                              return true;
                          }
                          if (code < 0) return true;
                          if (a == MotionEvent.ACTION_DOWN) { v.setAlpha(1f); send(code, true); }
                          else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) { v.setAlpha(0.75f); send(code, false); }
                          return true;
                      }
                  });
                  ref[0] = pop(t, sz, sz, pos[0], pos[1]);
                  wins.add(ref[0]);
              }

              static void send(final int code, final boolean down) {
                  EX.execute(new Runnable() {
                      public void run() {
                          try {
                              if (inst == null) inst = new Instrumentation();
                              long t = SystemClock.uptimeMillis();
                              inst.sendKeySync(new KeyEvent(t, t, down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, code, 0));
                          } catch (final Throwable e) {
                              H.post(new Runnable() { public void run() {
                                  if (!toasted && act != null) {
                                      toasted = true;
                                      Toast.makeText(act, "Key injection failed: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();
                                  }
                              } });
                          }
                      }
                  });
              }

              static int keyCode(String label) {
                  String s = label.trim().toUpperCase(Locale.ROOT);
                  if (s.length() == 1) {
                      char c = s.charAt(0);
                      if (c >= 'A' && c <= 'Z') return KeyEvent.KEYCODE_A + (c - 'A');
                      if (c >= '0' && c <= '9') return KeyEvent.KEYCODE_0 + (c - '0');
                  }
                  if (s.length() >= 2 && s.charAt(0) == 'F') {
                      try { int n = Integer.parseInt(s.substring(1)); if (n >= 1 && n <= 12) return KeyEvent.KEYCODE_F1 + (n - 1); } catch (Throwable t) { }
                  }
                  if (s.equals("JUMP") || s.equals("SPACE")) return KeyEvent.KEYCODE_SPACE;
                  if (s.equals("SHIFT") || s.equals("SNEAK")) return KeyEvent.KEYCODE_SHIFT_LEFT;
                  if (s.equals("CTRL") || s.equals("SPRINT")) return KeyEvent.KEYCODE_CTRL_LEFT;
                  if (s.equals("ESC")) return KeyEvent.KEYCODE_ESCAPE;
                  if (s.equals("ENTER")) return KeyEvent.KEYCODE_ENTER;
                  if (s.equals("TAB")) return KeyEvent.KEYCODE_TAB;
                  if (s.equals("UP")) return KeyEvent.KEYCODE_DPAD_UP;
                  if (s.equals("DOWN")) return KeyEvent.KEYCODE_DPAD_DOWN;
                  if (s.equals("LEFT")) return KeyEvent.KEYCODE_DPAD_LEFT;
                  if (s.equals("RIGHT")) return KeyEvent.KEYCODE_DPAD_RIGHT;
                  return -1;
              }

              static void toast(String m) { Toast.makeText(act, m, Toast.LENGTH_SHORT).show(); }

              static void openMenu() {
                  final String[] items = {"Keymap: " + (keymapOn ? "ON" : "OFF"), "Edit mode: " + (edit ? "ON" : "OFF"),
                          "Add button", "Remove button", "Profile: " + cur, "New profile", "Reset this profile", "Cancel"};
                  new AlertDialog.Builder(act).setTitle("Launcher").setItems(items, new DialogInterface.OnClickListener() {
                      public void onClick(DialogInterface d, int w) { menu(w); }
                  }).show();
              }

              static void menu(int w) {
                  try {
                      if (w == 0) { keymapOn = !keymapOn; save(); buildAll(); }
                      else if (w == 1) { edit = !edit; toast(edit ? "Drag the buttons, then turn Edit mode off" : "Edit mode off"); }
                      else if (w == 2) ask("Key label (W A S D E Space Shift Ctrl Esc Tab 1-9 F1-F12)", new Cb() { public void ok(String s) {
                          if (keyCode(s) < 0) { toast("Unknown key: " + s); return; }
                          try {
                              JSONObject o = new JSONObject();
                              o.put("l", s.trim()); o.put("x", 0.45); o.put("y", 0.45);
                              arr().put(o); save(); buildAll();
                          } catch (Throwable t) { }
                      } });
                      else if (w == 3) {
                          final JSONArray a = arr();
                          final String[] names = new String[a.length()];
                          for (int i = 0; i < names.length; i++) names[i] = a.optJSONObject(i).optString("l", "?");
                          new AlertDialog.Builder(act).setTitle("Remove which?").setItems(names, new DialogInterface.OnClickListener() {
                              public void onClick(DialogInterface d, int i) {
                                  try {
                                      JSONArray n = new JSONArray();
                                      for (int k = 0; k < a.length(); k++) if (k != i) n.put(a.get(k));
                                      profiles.put(cur, n); save(); buildAll();
                                  } catch (Throwable t) { }
                              }
                          }).show();
                      }
                      else if (w == 4) {
                          final List<String> n = new ArrayList<String>();
                          java.util.Iterator<String> it = profiles.keys();
                          while (it.hasNext()) n.add(it.next());
                          new AlertDialog.Builder(act).setTitle("Profile").setItems(n.toArray(new String[0]), new DialogInterface.OnClickListener() {
                              public void onClick(DialogInterface d, int i) { cur = n.get(i); save(); buildAll(); }
                          }).show();
                      }
                      else if (w == 5) ask("New profile name", new Cb() { public void ok(String s) {
                          s = s.trim();
                          if (s.length() == 0 || profiles.has(s)) { toast("Name empty or already used"); return; }
                          try { profiles.put(s, new JSONArray()); cur = s; save(); buildAll(); } catch (Throwable t) { }
                      } });
                      else if (w == 6) { try { profiles.put(cur, defaults()); save(); buildAll(); } catch (Throwable t) { } }
                  } catch (Throwable t) { }
              }

              static void ask(String title, final Cb cb) {
                  final EditText et = new EditText(act);
                  et.setInputType(InputType.TYPE_CLASS_TEXT);
                  new AlertDialog.Builder(act).setTitle(title).setView(et)
                          .setPositiveButton("OK", new DialogInterface.OnClickListener() {
                              public void onClick(DialogInterface d, int w) { cb.ok(et.getText().toString()); }
                          })
                          .setNegativeButton("Cancel", null).show();
              }
          }
          EOF_H
          mkdir -p $(dirname patch_smali.py)
          cat > patch_smali.py <<'EOF_P'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1])
          f = next(root.glob("smali*/com/mojang/minecraftpe/MainActivity.smali"), None)
          if not f:
              sys.exit("MainActivity.smali not found")
          s = f.read_text()
          if "Ldev/mcpelauncher/Hook;" in s:
              print("already patched"); sys.exit(0)
          m = re.search(r"\.method [^\n]*onCreate\(Landroid/os/Bundle;\)V", s)
          if not m:
              sys.exit("onCreate(Bundle) not found in MainActivity")
          sup = re.compile(r"[ \t]*invoke-super \{p0, p1\}, L[^;]+;->onCreate\(Landroid/os/Bundle;\)V[^\n]*\n")
          mm = sup.search(s, m.end())
          if not mm:
              sys.exit("super.onCreate call not found")
          call = "    invoke-static {p0}, Ldev/mcpelauncher/Hook;->onCreate(Landroid/app/Activity;)V\n"
          s = s[:mm.end()] + call + s[mm.end():]
          f.write_text(s)
          print("patched", f)
          EOF_P
          mkdir -p $(dirname repack.py)
          cat > repack.py <<'EOF_R'
          import sys, zipfile, re
          base, rebuilt, ldex, out = sys.argv[1:5]
          zb = zipfile.ZipFile(base)
          new_main = zipfile.ZipFile(rebuilt).read("classes.dex")
          names = set(zb.namelist())
          n = 2
          while "classes%d.dex" % n in names:
              n += 1
          with zipfile.ZipFile(out, "w") as zo:
              for i in zb.infolist():
                  if i.filename.startswith("META-INF/") or i.filename == "classes.dex":
                      continue
                  zi = zipfile.ZipInfo(i.filename, i.date_time)
                  zi.compress_type = i.compress_type
                  zi.external_attr = i.external_attr
                  zo.writestr(zi, zb.read(i.filename))
              zo.writestr("classes.dex", new_main, zipfile.ZIP_DEFLATED)
              zo.writestr("classes%d.dex" % n, open(ldex, "rb").read(), zipfile.ZIP_DEFLATED)
          print("repacked ->", out, "launcher dex = classes%d.dex" % n)
          EOF_R

      - name: Build, patch, sign
        run: |
          set -e
          SDKJ=$ANDROID_HOME/platforms/android-34/android.jar
          BT=$ANDROID_HOME/build-tools/34.0.0
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          mkdir -p cls dexout out ks
          javac -source 8 -target 8 -cp $SDKJ -d cls src/dev/mcpelauncher/Hook.java
          $BT/d8 --release --min-api 21 --lib $SDKJ --output dexout cls/dev/mcpelauncher/*.class
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          java -jar apktool.jar d -r -f base.apk -o dec
          python3 patch_smali.py dec
          java -jar apktool.jar b dec -o rebuilt.apk
          python3 repack.py base.apk rebuilt.apk dexout/classes.dex out/unsigned.apk
          $BT/zipalign -f -p 4 out/unsigned.apk out/aligned.apk
          [ -f ks/k.jks ] || keytool -genkeypair -keystore ks/k.jks -storepass android -keypass android -alias k -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=McpeLauncher"
          $BT/apksigner sign --ks ks/k.jks --ks-pass pass:android --key-pass pass:android --out out/McpeLauncher.apk out/aligned.apk
          $BT/apksigner verify out/McpeLauncher.apk
          ls -la out
